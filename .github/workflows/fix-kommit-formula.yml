# kommit's formula is regenerated by cargo-dist on every release, which drops
# the `test do` block and re-adds a redundant `version` line. Patch it back.
name: fix kommit formula

on:
  push:
    branches:
      - main
    paths:
      - Formula/kommit.rb
  workflow_dispatch:

permissions: {}

concurrency:
  group: fix-kommit-formula
  cancel-in-progress: false

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      # Push the patched formula.
      contents: write
      # Dispatch brew test-bot: pushes made with GITHUB_TOKEN do not trigger
      # other workflows, but workflow_dispatch events do.
      actions: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - name: Patch formula
        run: .github/scripts/fix-kommit-formula.sh Formula/kommit.rb

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- Formula/kommit.rb; then
            echo "Formula already patched"
            exit 0
          fi

          version="$(grep -oE 'releases/download/v[^/]+' Formula/kommit.rb | head -n 1 | sed 's|.*/v||')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "kommit ${version}: add test block and drop redundant version" -- Formula/kommit.rb
          git push origin HEAD:main

          gh workflow run tests.yml --ref main
